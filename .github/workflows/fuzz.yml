# The deep build-fuzz hunt, on every push. CI runs a light sweep inline;
# this job runs the real evolutionary search across all four biomes so a
# curve-breaking build is caught by the push that introduced it, instead of
# surfacing days later in a weekly run nobody is watching. A BREAKING
# finding fails the job (red run → investigate, ablation before blame);
# warnings print in the log with repro genomes, same as local.
name: Deep fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        biome: [verdant, frostfen, emberwaste, highlands]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fuzz:builds
        env:
          FUZZ_BIOME: ${{ matrix.biome }}
